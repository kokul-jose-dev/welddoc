<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeldDoc — Material usage</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="chrome"></div>
<main class="content">
  <div class="context-bar" id="mu-context"></div>
  <div class="page-header"><div><h1 id="mu-title">Material usage</h1><div class="page-subtitle" id="mu-subtitle"></div></div>
    <div style="display:flex;gap:8px;"><button type="button" class="btn btn-ghost" id="mu-edit-btn" onclick="openMuEdit()" data-i18n="edit_material">Edit material</button>
    <button type="button" class="btn btn-primary" id="mu-add-to-project-btn" onclick="openMuAddToProject()" data-i18n="add_to_project">Add to project</button></div></div>
  <div class="info-panel"><div class="info-grid" id="mu-info"></div></div>
  <div class="stat-grid" id="mu-stats"></div>
  <div id="mu-archive-bar"></div>
  <div class="section-label" data-i18n="waz_documents_for_material" style="margin-top:20px;">WAZ Documents</div>
  <div class="table-card"><table class="table-wide"><thead><tr id="mu-waz-thead"></tr></thead><tbody id="mu-waz-tbody"></tbody></table></div>
  <div class="section-label" data-i18n="usage_across_pipelines" style="margin-top:24px;">Usage across pipelines</div>
  <div class="table-card"><table class="table-wide"><thead><tr id="mu-usage-thead"></tr></thead><tbody id="mu-usage-tbody"></tbody></table></div>
</main>
<div id="modal-root"></div>
<script src="i18n.js?v=50"></script><script src="app.js?v=51"></script><script>initMaterialUsagePage();</script>
</body></html>
