<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeldDoc — Pipeline detail</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="chrome"></div>
<main class="content">
  <div class="context-bar" id="detail-context"></div>
  <div class="page-header"><div>
    <div class="title-switch"><span class="title-switch-label">Pipeline</span><select id="pipeline-switch" onchange="switchPipeline(this.value)"></select></div>
    <div class="page-subtitle" id="detail-subtitle"></div>
  </div></div>
  <div class="info-panel"><div class="info-grid" id="detail-info"></div></div>
  <div id="detail-workflow"></div>
  <div class="subtab-nav">
    <button class="subtab active" id="subtab-materials" onclick="showDetailView('materials')">Material list</button>
    <button class="subtab" id="subtab-weldlist" onclick="showDetailView('weldlist')">Weld list</button>
    <button class="subtab" id="subtab-combined" onclick="showDetailView('combined')">Combined view</button>
  </div>
  <div id="detail-materials">
    <div class="detail-toolbar"><h2>Material list</h2><div style="display:flex;gap:8px;"><a class="btn btn-ghost btn-sm" href="archive.html?tab=materials"><svg viewBox="0 0 24 24" width="14" height="14" fill="none"><rect x="3" y="4" width="18" height="4" rx="1" stroke="currentColor" stroke-width="1.8"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M10 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Archive</a><button class="btn btn-primary btn-sm" onclick="openAddMaterialChoice()">+ Add material</button></div></div>
    <div class="table-card"><table class="table-xwide"><thead><tr><th>Pos.</th><th>Category</th><th>DN</th><th>Diameter</th><th>Thickness</th><th>DIN EN No.</th><th>Surface</th><th>Item description</th><th>Material</th><th>Certificate</th><th>Heat&nbsp;No.</th><th>WAZ&nbsp;No.</th><th>Welds</th><th></th></tr></thead><tbody id="materials-tbody"></tbody></table></div>
    <div id="welding-wire-section"></div>
    <div id="materials-markdone"></div>
  </div>
  <div id="detail-weldlist" style="display:none;">
    <div class="detail-toolbar"><h2>Weld seam list</h2><div style="display:flex;gap:8px;"><a class="btn btn-ghost btn-sm" href="archive.html?tab=welds"><svg viewBox="0 0 24 24" width="14" height="14" fill="none"><rect x="3" y="4" width="18" height="4" rx="1" stroke="currentColor" stroke-width="1.8"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M10 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Archive</a><button class="btn btn-primary btn-sm" onclick="openWeldModal()">+ Add weld</button></div></div>
    <div class="table-card"><table class="table-xwide"><thead><tr><th>Weld No.</th><th>Between</th><th>Type</th><th>Proc.</th><th>Welding Wire</th><th>Welder</th><th>Inspector</th><th>Date</th><th>Endo. Video</th><th>Endo. Image</th><th>Remarks</th><th></th></tr></thead><tbody id="weldlist-tbody"></tbody></table></div>
    <div id="weldlist-markdone"></div>
  </div>
  <div id="detail-combined" style="display:none;">
    <div class="detail-toolbar"><h2>Combined view</h2></div>
    <div id="combined-content"></div>
  </div>
  <div id="detail-seam" style="display:none;">
    <button class="back-link" onclick="showDetailView('weldlist')">&larr; Back to weld list</button>
    <div id="seam-content"></div>
  </div>
</main>
<div id="modal-root"></div>
<script src="app.js"></script><script>initPipelineDetailPage();</script>
</body></html>
