<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeldDoc — Pipeline detail</title><link rel="stylesheet" href="styles.css?v=42"></head><body class="page-pipeline-detail">
<div id="chrome"></div>
<main class="content">
  <div class="context-bar" id="detail-context"></div>
  <div class="page-header"><div>
    <div class="title-switch"><span class="title-switch-label" data-i18n="th_pipeline_no">Pipeline</span><select id="pipeline-switch" onchange="switchPipeline(this.value)"></select></div>
    <div class="page-subtitle" id="detail-subtitle"></div>
  </div><div style="display:flex;gap:8px;"><button type="button" class="btn btn-ghost" id="regenerate-pipeline-waz-btn" onclick="regeneratePipelineWaz()" title="Regenerate all WAZ cover letters and update filenames on SharePoint"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg><span data-i18n="regenerate_waz">Regenerate WAZ</span></button></div></div>
  <div class="info-panel"><div class="info-grid" id="detail-info"></div></div>
  <div id="detail-workflow"></div>
  <div class="subtab-nav">
    <button class="subtab active" id="subtab-materials" onclick="showDetailView('materials')" data-i18n="material_list">Material list</button>
    <button class="subtab" id="subtab-weldlist" onclick="showDetailView('weldlist')" data-i18n="weld_list">Weld list</button>
    <button class="subtab" id="subtab-combined" onclick="showDetailView('combined')" data-i18n="combined_view">Combined view</button>
  </div>
  <div id="detail-materials">
    <div class="detail-toolbar"><h2 data-i18n="material_list">Material list</h2><div style="display:flex;gap:8px;"><a class="btn btn-ghost btn-sm" href="archive.html?tab=materials"><svg viewBox="0 0 24 24" width="14" height="14" fill="none"><rect x="3" y="4" width="18" height="4" rx="1" stroke="currentColor" stroke-width="1.8"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M10 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> <span data-i18n="archive">Archive</span></a><button class="btn btn-primary btn-sm" onclick="openMaterialModal()" data-i18n="add_material">+ Add material</button></div></div>
    <div class="table-card"><table class="table-xwide"><thead><tr><th data-i18n="th_pos">Pos.</th><th data-i18n="th_category">Category</th><th data-i18n="th_item_description">Item description</th><th data-i18n="th_dn">DN</th><th data-i18n="th_diameter">Diameter</th><th data-i18n="th_thickness">Thickness</th><th data-i18n="th_din_en_no">DIN EN No.</th><th data-i18n="th_surface">Surface</th><th data-i18n="th_material">Material</th><th data-i18n="th_certificate">Certificate</th><th data-i18n="th_heat_no">Heat&nbsp;No.</th><th data-i18n="th_waz_no">WAZ&nbsp;No.</th><th data-i18n="th_welds">Welds</th><th></th></tr></thead><tbody id="materials-tbody"></tbody></table></div>
    <div id="welding-wire-section"></div>
    <div id="materials-markdone"></div>
  </div>
  <div id="detail-weldlist" style="display:none;">
    <div class="detail-toolbar"><h2 data-i18n="weld_seam_list">Weld seam list</h2><div style="display:flex;gap:8px;"><a class="btn btn-ghost btn-sm" href="archive.html?tab=welds"><svg viewBox="0 0 24 24" width="14" height="14" fill="none"><rect x="3" y="4" width="18" height="4" rx="1" stroke="currentColor" stroke-width="1.8"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M10 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> <span data-i18n="archive">Archive</span></a><button class="btn btn-primary btn-sm" onclick="openWeldModal()" data-i18n="add_weld">+ Add weld</button></div></div>
    <div class="table-card"><table class="table-xwide"><thead><tr><th data-i18n="th_weld_no">Weld No.</th><th data-i18n="th_between">Between</th><th data-i18n="th_type">Type</th><th data-i18n="th_proc">Proc.</th><th data-i18n="th_welding_wire">Welding Wire</th><th data-i18n="th_welder">Welder</th><th data-i18n="th_inspector">Inspector</th><th data-i18n="th_date">Date</th><th data-i18n="th_endo_video">Endo. Video</th><th data-i18n="th_endo_image">Endo. Image</th><th data-i18n="th_remarks">Remarks</th><th></th></tr></thead><tbody id="weldlist-tbody"></tbody></table></div>
    <div id="weldlist-markdone"></div>
  </div>
  <div id="detail-combined" style="display:none;">
    <div class="detail-toolbar"><h2 data-i18n="combined_view">Combined view</h2></div>
    <div id="combined-content"></div>
  </div>
  <div id="detail-seam" style="display:none;">
    <button class="back-link" onclick="showDetailView('weldlist')" data-i18n="back_to_weldlist">&larr; Back to weld list</button>
    <div id="seam-content"></div>
  </div>
</main>
<div id="modal-root"></div>
<script src="i18n.js?v=45"></script><script src="app.js?v=45"></script><script>initPipelineDetailPage();</script>
</body></html>
