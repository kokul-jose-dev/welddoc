<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeldDoc — Welder profile</title><link rel="stylesheet" href="styles.css?v=72"></head><body>
<div id="chrome"></div>
<main class="content" id="profile-body">
  <a class="back-link" href="welders.html" data-i18n="back_to_welders">&larr; Back to welders</a>
  <div class="profile-head"><div class="profile-avatar" id="profile-avatar"></div><div class="profile-meta"><h1 id="profile-name"></h1><div class="sub" id="profile-sub"></div></div>
    <div id="profile-signature-box" style="margin-left:20px;"></div>
    <span style="flex:1"></span><button class="btn btn-primary" id="profile-add-cert-btn" data-i18n="add_certificate_btn">+ Add certificate</button></div>
  <div class="stat-grid" id="profile-stats"></div>
  <div class="subtab-nav">
    <button class="subtab active" id="ptab-active" onclick="switchProfileCertTab('active')"><span data-i18n="certificates">Certificates</span> <span id="ptab-active-count"></span></button>
    <button class="subtab" id="ptab-archived" onclick="switchProfileCertTab('archived')"><span data-i18n="archived_certificates">Archived certificates</span> <span id="ptab-archived-count"></span></button>
  </div>
  <div id="profile-active-section"><div class="table-card"><table><thead><tr><th data-i18n="th_cert_no">WPS&nbsp;No.</th><th data-i18n="th_process">Process</th><th data-i18n="th_standard">Standard</th><th data-i18n="th_valid_until">Certificate Valid Until</th><th data-i18n="th_renewal_due">Verification Due</th><th data-i18n="th_pdf">PDF</th><th data-i18n="th_signature">Sign</th><th></th></tr></thead><tbody id="profile-certs-tbody"></tbody></table></div></div>
  <div id="profile-archived-section" style="display:none;">
    <div class="table-card"><table><thead><tr><th data-i18n="th_cert_no">WPS&nbsp;No.</th><th data-i18n="th_process">Process</th><th data-i18n="th_standard">Standard</th><th data-i18n="th_valid_until">Certificate Valid Until</th><th data-i18n="th_renewal_due">Verification Due</th><th data-i18n="th_pdf">PDF</th><th data-i18n="th_signature">Sign</th></tr></thead><tbody id="profile-archived-certs-tbody"></tbody></table></div>
  </div>
</main>
<div id="modal-root"></div>
<script src="i18n.js?v=79"></script>
<script src="app.js?v=110"></script>
<script>initWelderProfilePage();</script>
</body></html>
