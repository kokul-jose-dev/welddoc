<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeldDoc — Materials</title><link rel="stylesheet" href="styles.css?v=37"></head><body>
<div id="chrome"></div>
<main class="content">
  <div class="page-header"><div><h1 data-i18n="materials_title">Materials</h1><div class="page-subtitle" data-i18n="materials_sub">Every material across all pipelines — click a column header to filter.</div></div></div>
  <div class="stat-grid" id="materials-stats"></div>

    <select id="mat-filter-client" onchange="onMaterialsFilterChange()"></select>

  </div>
  <div class="table-card"><table class="table-wide"><thead><tr id="mat-thead"></tr></thead><tbody id="materials-page-tbody"></tbody></table></div>
</main>
<div id="modal-root"></div>
<script src="i18n.js?v=37"></script><script src="app.js?v=37"></script><script>initMaterialsPage();</script>
