<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeldDoc — Project detail</title><link rel="stylesheet" href="styles.css?v=42">
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script></head><body class="page-project-detail">
<div id="chrome"></div>
<main class="content">
  <div class="context-bar" id="project-context"></div>
  <div class="page-header"><div>
    <div class="title-switch"><span class="title-switch-label" data-i18n="th_project">Project</span><select id="project-switch" onchange="switchProject(this.value)"></select></div>
    <div class="page-subtitle" id="project-subtitle"></div>
  </div><button class="btn btn-primary" onclick="openProjectModal(PAGE.projectId)" data-i18n="edit_project">Edit project</button></div>
  <div class="info-panel"><div class="info-grid" id="project-info"></div></div>
  <div class="stat-grid" id="project-stats"></div>
  <div class="subtab-nav">
    <button class="subtab active" id="subtab-pipelines" onclick="showProjectView('pipelines')" data-i18n="pipelines">Pipelines</button>
    <button class="subtab" id="subtab-proj-materials" onclick="showProjectView('proj-materials')" data-i18n="project_materials">Project Materials</button>
  </div>
  <div id="project-pipelines-view">
    <div class="detail-toolbar" id="project-toolbar"></div>
    <div id="project-pipelines"></div>
  </div>
  <div id="project-materials-view" style="display:none">
    <div class="detail-toolbar"><h2 data-i18n="project_materials">Project Materials</h2><div style="display:flex;gap:8px;"><a class="btn btn-ghost btn-sm" href="archive.html?tab=projectmaterials"><svg viewBox="0 0 24 24" width="14" height="14" fill="none"><rect x="3" y="4" width="18" height="4" rx="1" stroke="currentColor" stroke-width="1.8"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M10 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> <span data-i18n="archive">Archive</span></a><button class="btn btn-primary btn-sm" onclick="openProjectMaterialModal()" data-i18n="add_material">+ Add material</button></div></div>
    <div class="table-card"><table class="table-xwide"><thead><tr id="proj-mat-thead"></tr></thead><tbody id="proj-materials-tbody"></tbody></table></div>
  </div>
</main>
<div id="modal-root"></div>
<script src="i18n.js?v=45"></script><script src="app.js?v=45"></script><script>initProjectDetailPage();</script>
</body></html>
